name: Publier le jeu

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
        env:
          VITE_BASE: /IncluJeux/
      - name: Envoyer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
